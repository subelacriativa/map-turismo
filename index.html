<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorar Destino - Agência de Viagens</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #1a0813 0%, #3a001a 100%);
color: #fff;
min-height: 100vh;
margin: 0;
display: flex;
flex-direction: column;
align-items: center;
padding: 15px;
box-sizing: border-box;
}

h1 { 
color: #ff3366; 
text-align: center; 
text-shadow: 0 0 10px rgba(255,51,102,0.5); 
font-size: 22px;
margin-top: 10px;
margin-bottom: 5px;
}

p { color: #cccccc; text-align: center; font-size: 14px; margin-top: 0; margin-bottom: 15px; }

.card {
background: rgba(255, 255, 255, 0.05);
backdrop-filter: blur(10px);
border: 1px solid rgba(255, 51, 102, 0.2);
border-radius: 20px;
padding: 15px;
width: 100%;
max-width: 450px;
box-sizing: border-box;
text-align: center;
box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
display: flex;
flex-direction: column;
height: calc(100vh - 50px); /* Ajusta para quase a tela toda do celular */
}

/* Container do Mapa */
#mapa {
width: 100%;
flex-grow: 1; /* Faz o mapa ocupar todo o espaço disponível do card */
border-radius: 15px;
border: 1px solid rgba(255, 51, 102, 0.3);
background: rgba(0, 0, 0, 0.3);
box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}

.btn {
background: linear-gradient(90deg, #ff3366, #ff0044);
color: white; border: none; padding: 12px 20px;
font-size: 15px; font-weight: bold; border-radius: 25px;
cursor: pointer; margin-top: 15px; width: 100%;
box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
transition: 0.2s;
text-transform: uppercase;
letter-spacing: 1px;
}

.btn:active {
transform: scale(0.98);
}

/* Estilização Customizada dos Popups do Mapa para combinar com o tema */
.leaflet-popup-content-wrapper {
background: rgba(26, 8, 19, 0.95) !important;
color: #fff !important;
border: 1px solid #ff3366;
font-family: 'Segoe UI', sans-serif;
border-radius: 10px;
}
.leaflet-popup-tip {
background: #ff3366 !important;
}
.popup-titulo {
color: #ff8fa3;
font-weight: bold;
margin: 0 0 5px 0;
font-size: 14px;
}
.popup-desc {
font-size: 12px;
color: #ddd;
margin: 0;
}

/* Tela de carregamento / Permissão */
.status-loading {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
z-index: 1000;
background: rgba(10, 3, 8, 0.9);
padding: 20px;
border-radius: 15px;
border: 1px solid #ff3366;
text-align: center;
width: 80%;
max-width: 300px;
}
</style>
</head>
<body>

<div class="card">
<h1>Guia de Bolso 🌍</h1>
<p>Pontos turísticos num raio de 5km de você</p>

<div id="status-tela" class="status-loading">
<h3 style="color: #ff8fa3; margin: 0 0 10px 0;">Buscando sua localização...</h3>
<p style="font-size: 12px; margin: 0;">Por favor, autorize o acesso à localização no seu celular se solicitado.</p>
</div>

<div id="mapa"></div>

<button class="btn" onclick="recarregarLocalizacao()">🔄 Atualizar Localização</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let mapa = null;
let marcadorUsuario = null;
let camadaPontos = null;

// Banco de dados simulado de pontos turísticos da sua agência.
// DICA: Você pode alimentar essa lista com as coordenadas dos pontos da cidade destino!
const pontosTuristicosDestaque = [
{ nome: "Monumento Histórico Central", lat: -23.55052, lon: -46.63330, desc: "O marco zero da cidade. Parada obrigatória!" },
{ nome: "Parque Ecológico Municipal", lat: -23.5489, lon: -46.6388, desc: "Lindo local para fotos e caminhada." },
{ nome: "Feira de Artesanato e Gastronomia", lat: -23.5550, lon: -46.6300, desc: "Melhores comidas típicas da região." },
{ nome: "Museu de Arte Moderna", lat: -23.5320, lon: -46.6250, desc: "Arquitetura incrível e exposições locais." },
// Se o turista estiver em outra cidade, o script usará pontos reais gerados dinamicamente via Overpass API abaixo.
];

document.addEventListener("DOMContentLoaded", () => {
inicializarMapaPadrao();
obterLocalizacaoAtual();
});

function inicializarMapaPadrao() {
// Inicializa o mapa focado no Brasil por padrão até receber o GPS
mapa = L.map('mapa').setView([-14.2350, -51.9253], 4);

// Layout do mapa em modo escuro/noturno para combinar com o design
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
attribution: '&copy; OpenStreetMap &copy; CARTO'
}).addTo(mapa);

camadaPontos = L.layerGroup().addTo(mapa);
}

function obterLocalizacaoAtual() {
if (!navigator.geolocation) {
alert("Seu navegador não suporta geolocalização.");
document.getElementById("status-tela").style.display = "none";
return;
}

navigator.geolocation.getCurrentPosition(
(posicao) => {
const lat = posicao.coords.latitude;
const lon = posicao.coords.longitude;

configurarMapaUsuario(lat, lon);
},
(erro) => {
console.error(erro);
alert("Não conseguimos acessar sua localização. Ative o GPS do celular.");
document.getElementById("status-tela").style.display = "none";
},
{ enableHighAccuracy: true, timeout: 10000 }
);
}

function configurarMapaUsuario(lat, lon) {
document.getElementById("status-tela").style.display = "none";

// Centraliza o mapa no usuário com zoom focado (escala de bairro)
mapa.setView([lat, lon], 14);

// Remove marcador antigo do usuário se existir
if (marcadorUsuario) mapa.removeLayer(marcadorUsuario);

// Adiciona marcador neon/azul brilhante para a posição do turista
marcadorUsuario = L.circleMarker([lat, lon], {
radius: 10,
fillColor: "#00d2d3",
color: "#fff",
weight: 2,
opacity: 1,
fillOpacity: 0.8
}).addTo(mapa).bindPopup("<b style='color:#00ffff;'>Você está aqui!</b>").openPopup();

// Adiciona um círculo translúcido rosa mostrando o raio de 5km
L.circle([lat, lon], {
radius: 5000, // 5000 metros = 5km
color: '#ff3366',
fillColor: '#ff3366',
fillOpacity: 0.05,
weight: 1,
dashArray: '5, 5'
}).addTo(mapa);

// Limpa pontos anteriores
camadaPontos.clearLayers();

// 1. Plotar pontos fixos da agência (caso estejam perto)
pontosTuristicosDestaque.forEach(ponto => {
const distancia = calcularDistancia(lat, lon, ponto.lat, ponto.lon);
if (distancia <= 5) { // menos de 5km
adicionarMarcadorPonto(ponto.lat, ponto.lon, ponto.nome, ponto.desc);
}
});

// 2. BUSCA AUTOMÁTICA EM TEMPO REAL (Opcional): Busca pontos turísticos reais do OpenStreetMap num raio de 5km
buscarPontosReaisDoMapa(lat, lon);
}

function adicionarMarcadorPonto(lat, lon, nome, descricao) {
// Marcador rosa neon para os pontos turísticos
L.circleMarker([lat, lon], {
radius: 8,
fillColor: "#ff3366",
color: "#ff8fa3",
weight: 2,
opacity: 1,
fillOpacity: 0.9
}).addTo(camadaPontos).bindPopup(`
<div class="popup-titulo">📍 ${nome}</div>
<div class="popup-desc">${descricao}</div>
`);
}

// Faz uma busca automática na API pública do OpenStreetMap por atrações turísticas em volta do cliente
function buscarPontosReaisDoMapa(lat, lon) {
// Query da Overpass API para buscar "tourism=attraction" e "tourism=viewpoint" num raio de 5000m
const url = `https://overpass-api.de/api/interpreter?data=[out:json];node["tourism"](around:5000,${lat},${lon});out;`;

fetch(url)
.then(response => response.json())
.then(data => {
if (data && data.elements) {
data.elements.forEach(elemento => {
const nome = elemento.tags.name || "Atração Turística";
const tipo = elemento.tags.tourism ? elemento.tags.tourism.toUpperCase() : "Ponto de interesse";
// Evita duplicar se já tiver um nome muito genérico sem tradução
if(elemento.tags.name) {
adicionarMarcadorPonto(elemento.lat, elemento.lon, nome, `Categoria: ${tipo}`);
}
});
}
})
.catch(err => console.log("Erro ao buscar pontos adicionais: ", err));
}

// Função matemática simples para calcular distância entre duas coordenadas (em km)
function calcularDistancia(lat1, lon1, lat2, lon2) {
const R = 6371;
const dLat = (lat2 - lat1) * Math.PI / 180;
const dLon = (lon2 - lon1) * Math.PI / 180;
const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
return R * c;
}

function recarregarLocalizacao() {
document.getElementById("status-tela").style.display = "block";
obterLocalizacaoAtual();
}
</script>
</body>
</html>
