<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia de Bolso - Agência de Viagens</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #1a0813 0%, #3a001a 100%);
color: #fff;
min-height: 100vh;
margin: 0;
display: flex;
flex-direction: column;
align-items: center;
padding: 10px;
box-sizing: border-box;
}

h1 { 
color: #ff3366; 
text-align: center; 
text-shadow: 0 0 10px rgba(255,51,102,0.5); 
font-size: 20px;
margin: 5px 0 2px 0;
}

p.subtitle { color: #cccccc; text-align: center; font-size: 12px; margin: 0 0 10px 0; }

.card {
background: rgba(255, 255, 255, 0.05);
backdrop-filter: blur(10px);
border: 1px solid rgba(255, 51, 102, 0.2);
border-radius: 20px;
padding: 12px;
width: 100%;
max-width: 450px;
box-sizing: border-box;
text-align: center;
box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
display: flex;
flex-direction: column;
height: calc(100vh - 20px);
}

/* Filtros de Categoria */
.filtros-container {
display: flex;
gap: 5px;
overflow-x: auto;
padding-bottom: 8px;
margin-bottom: 8px;
scrollbar-width: none;
}
.filtros-container::-webkit-scrollbar { display: none; }

.btn-filtro {
background: rgba(255, 255, 255, 0.1);
color: #fff;
border: 1px solid rgba(255, 51, 102, 0.2);
padding: 6px 14px;
font-size: 11px;
border-radius: 15px;
cursor: pointer;
white-space: nowrap;
transition: 0.2s;
}
.btn-filtro.ativo {
background: linear-gradient(90deg, #ff3366, #ff0044);
border-color: transparent;
box-shadow: 0 0 8px rgba(255, 51, 102, 0.5);
}

/* Alternador de Abas (Mapa / Lista) */
.abas-container {
display: flex;
background: rgba(0, 0, 0, 0.4);
border-radius: 25px;
padding: 3px;
margin-bottom: 10px;
border: 1px solid rgba(255, 51, 102, 0.1);
}
.aba {
flex: 1;
padding: 8px 0;
font-size: 13px;
font-weight: bold;
cursor: pointer;
border-radius: 20px;
transition: 0.2s;
color: #aaa;
}
.aba.ativa {
background: rgba(255, 255, 255, 0.1);
color: #ff8fa3;
}

/* Conteito das Abas */
.conteudo-aba { display: none; flex-grow: 1; width: 100%; position: relative; }
.conteudo-aba.ativa { display: flex; flex-direction: column; }

#mapa {
width: 100%;
flex-grow: 1;
border-radius: 15px;
border: 1px solid rgba(255, 51, 102, 0.3);
background: rgba(0, 0, 0, 0.3);
}

/* Viewport da Lista */
#lista-container {
flex-grow: 1;
overflow-y: auto;
text-align: left;
padding-right: 2px;
}

/* Item da Lista de Lugares */
.lugar-item {
background: rgba(255, 255, 255, 0.06);
border: 1px solid rgba(255, 255, 255, 0.05);
border-radius: 12px;
padding: 10px;
margin-bottom: 8px;
display: flex;
gap: 10px;
align-items: center;
transition: 0.2s;
}
.lugar-item.parceiro {
border: 1px solid rgba(255, 215, 0, 0.4);
background: linear-gradient(135deg, rgba(40, 20, 5, 0.4) 0%, rgba(20, 10, 0, 0.4) 100%);
}
.lugar-img {
width: 70px;
height: 70px;
object-fit: cover;
border-radius: 8px;
border: 1px solid rgba(255,255,255,0.1);
}
.lugar-info { flex: 1; min-width: 0; }
.lugar-nome { font-size: 13px; font-weight: bold; color: #fff; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.lugar-meta { font-size: 11px; color: #ff8fa3; margin-bottom: 4px; }
.lugar-item.parceiro .lugar-meta { color: #ffd700; font-weight: bold; }

/* Botões Globais e de Rota */
.btn-rota {
background: linear-gradient(90deg, #00d2d3, #00a8ff);
color: white !important;
border: none;
padding: 5px 10px;
font-size: 11px;
font-weight: bold;
border-radius: 12px;
text-decoration: none;
text-transform: uppercase;
display: inline-block;
text-align: center;
box-shadow: 0 2px 6px rgba(0, 210, 211, 0.3);
}

.btn-whatsapp {
background: linear-gradient(90deg, #25d366, #128c7e);
color: white; text-decoration: none; padding: 10px;
font-size: 13px; font-weight: bold; border-radius: 25px;
margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
}

/* Animação União de Pulsar para Parceiro */
@keyframes pulsarOuro {
0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
70% { box-shadow: 0 0 0 6px rgba(255, 215, 0, 0); }
100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
}

/* Popups Internos */
.popup-container { display: flex; flex-direction: column; align-items: center; width: 150px; }
.popup-img { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; margin-bottom: 6px; }
.leaflet-popup-content-wrapper { background: rgba(26, 8, 19, 0.96) !important; color: #fff !important; border: 1px solid #ff3366; border-radius: 12px; }
.leaflet-popup-tip { background: #ff3366 !important; }
.popup-titulo { color: #ff8fa3; font-weight: bold; font-size: 12px; text-align: center; }

.status-loading {
position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;
background: rgba(10, 3, 8, 0.95); padding: 20px; border-radius: 15px; border: 1px solid #ff3366; text-align: center; width: 75%;
}
</style>
</head>
<body>

<div class="card">
<h1>Guia de Bolso 🌍</h1>
<p class="subtitle">Explorando o melhor em um raio de 15km</p>

<div class="filtros-container">
<button class="btn-filtro ativo" onclick="filtrarCategoria('TODOS', this)">✨ Tudo</button>
<button class="btn-filtro" onclick="filtrarCategoria('PARCEIRO', this)">⭐ Da Agência</button>
<button class="btn-filtro" onclick="filtrarCategoria('ATTRACTION', this)">🎭 Atrações</button>
<button class="btn-filtro" onclick="filtrarCategoria('VIEWPOINT', this)">📸 Mirantes</button>
<button class="btn-filtro" onclick="filtrarCategoria('MUSEUM', this)">🏛️ Museus</button>
</div>

<div class="abas-container">
<div class="aba ativa" id="aba-mapa" onclick="mudarAba('mapa')">🗺️ Ver Mapa</div>
<div class="aba" id="aba-lista" onclick="mudarAba('lista')">📋 Ver Lista (<span id="count-lugares">0</span>)</div>
</div>

<div id="container-mapa" class="conteudo-aba ativa">
<div id="status-tela" class="status-loading">
<h3 style="color: #ff8fa3; margin: 0 0 5px 0; font-size:15px;">Rastreando GPS...</h3>
<p style="font-size: 11px; margin: 0; color:#aaa;">Ative a localização de alta precisão do seu celular.</p>
</div>
<div id="mapa"></div>
</div>

<div id="container-lista" class="conteudo-aba">
<div id="lista-container">
</div>
</div>

<a href="https://wa.me/5500999999999?text=Ol%C3%A1!%20Estou%20usando%20o%20guia%20do%20b%C3%B3ton%20e%20gostaria%20de%20informa%C3%A7%C3%B5es." target="_blank" class="btn-whatsapp">
<svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.907h.004c4.368 0 7.926-3.558 7.93-7.93a7.897 7.897 0 0 0-2.333-5.594M7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.69-4.98c-.202-.101-1.194-.588-1.379-.653-.185-.066-.32-.098-.456.101-.137.202-.53.653-.65.789-.12.137-.241.153-.443.052-1.2-.593-2.073-1.055-2.88-2.451-.215-.369-.02-.341.186-.753.128-.256.065-.479-.033-.68-.098-.2-.456-1.1-.625-1.506-.165-.4-.335-.345-.456-.351-.115-.006-.248-.007-.381-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.054 1.194-.488 1.362-1.03.168-.543.168-1.01.117-1.103-.05-.094-.187-.137-.388-.239z"/></svg>
Suporte da Agência
</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let mapa = null;
let marcadorUsuario = null;
let camadaPontos = null;
let circuloRaio = null;

let dadosGeraisLugares = []; // Memória global dos lugares encontrados
let filtroAtual = 'TODOS';
let latUser = null;
let lonUser = null;

// BANCO DE DADOS DA AGÊNCIA: Pontos com destaque e marcador exclusivo (Aparecem sempre no topo)
const pontosParceirosAgencia = [
{ nome: "Agência Central & Lounge", lat: -23.5505, lon: -46.6333, desc: "Retire seus mimos e água mineral aqui!", foto: "https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=200", categoria: "PARCEIRO" },
{ nome: "Restaurante Conveniado Ouro", lat: -23.5460, lon: -46.6280, desc: "Apresente o Bóton e ganhe 10% de desconto!", foto: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=200", categoria: "PARCEIRO" }
];

document.addEventListener("DOMContentLoaded", () => {
mapa = L.map('mapa').setView([-14.235, -51.925], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO' }).addTo(mapa);
camadaPontos = L.layerGroup().addTo(mapa);
obterLocalizacaoAtual();
});

function obterLocalizacaoAtual() {
if (!navigator.geolocation) return alert("Seu GPS não é suportado.");
navigator.geolocation.getCurrentPosition(
(pos) => {
latUser = pos.coords.latitude;
lonUser = pos.coords.longitude;
document.getElementById("status-tela").style.display = "none";
inicializarInterfaceUsuario();
},
() => { alert("Por favor, ative o GPS para mapear os arredores."); },
{ enableHighAccuracy: true, timeout: 12000 }
);
}

function inicializarInterfaceUsuario() {
mapa.setView([latUser, lonUser], 12);

marcadorUsuario = L.circleMarker([latUser, lonUser], {
radius: 9, fillColor: "#00d2d3", color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.8
}).addTo(mapa).bindPopup("<b>Você está aqui!</b>");

circuloRaio = L.circle([latUser, lonUser], {
radius: 15000, color: '#ff3366', fillColor: '#ff3366', fillOpacity: 0.01, weight: 1, dashArray: '4, 4'
}).addTo(mapa);

// Carregar pontos locais criados por você
pontosParceirosAgencia.forEach(p => {
p.distancia = calcularDistancia(latUser, lonUser, p.lat, p.lon);
if (p.distancia <= 15) dadosGeraisLugares.push(p);
});

// Chamar busca pública otimizada limitada a 30 itens
buscarPontosPublicos();
}

function buscarPontosPublicos() {
// Query otimizada puxando apenas os nós principais e limitando o retorno global a 30 itens
const urlOverpass = `https://overpass-api.de/api/interpreter?data=[out:json][timeout:12];node["tourism"~"attraction|viewpoint|museum"](around:15000,${latUser},${lonUser});out 30;`;

fetch(urlOverpass)
.then(res => res.json())
.then(data => {
if (data && data.elements) {
let promessasImagens = data.elements.map(el => {
let cat = el.tags.tourism.toUpperCase();
let nome = el.tags.name;
if (!nome) return null;

return fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(nome)}`)
.then(r => r.ok ? r.json() : fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(nome)}`).then(resEn => resEn.json()))
.then(dWiki => {
dadosGeraisLugares.push({
nome: nome, lat: el.lat, lon: el.lon,
desc: dWiki.extract ? dWiki.extract.substring(0, 55) + "..." : `Ponto turístico local`,
foto: dWiki.thumbnail ? dWiki.thumbnail.source : "https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=200",
categoria: cat,
distancia: calcularDistancia(latUser, lonUser, el.lat, el.lon)
});
}).catch(() => {
dadosGeraisLugares.push({
nome: nome, lat: el.lat, lon: el.lon, desc: "Ponto turístico local",
foto: "https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=200",
categoria: cat, distancia: calcularDistancia(latUser, lonUser, el.lat, el.lon)
});
});
});

Promise.all(promessasImagens).then(() => {
// Ordenar tudo por distância antes de exibir
dadosGeraisLugares.sort((a,b) => a.distancia - b.distancia);
atualizarElementosTela();
});
}
}).catch(() => { atualizarElementosTela(); });
}

function atualizarElementosTela() {
camadaPontos.clearLayers();
const listaContainer = document.getElementById("lista-container");
listaContainer.innerHTML = "";

let locaisFiltrados = dadosGeraisLugares.filter(l => filtroAtual === 'TODOS' || l.categoria === filtroAtual);
document.getElementById("count-lugares").innerText = locaisFiltrados.length;

locaisFiltrados.forEach(lugar => {
const linkMapa = `http://googleusercontent.com/maps.google.com/6{lugar.lat},${lugar.lon}`;
const ehParceiro = lugar.categoria === 'PARCEIRO';

// 1. ADICIONAR MARCADOR NO MAPA
const corMarcador = ehParceiro ? "#ffd700" : "#ff3366";
const corBorda = ehParceiro ? "#fff" : "#ff8fa3";

const m = L.circleMarker([lugar.lat, lugar.lon], {
radius: ehParceiro ? 9 : 7, fillColor: corMarcador, color: corBorda, weight: 2, opacity: 1, fillOpacity: 0.9
}).addTo(camadaPontos);

if(ehParceiro && m._path) {
m._path.style.animation = "pulsarOuro 1.5s infinite";
}

m.bindPopup(`
<div class="popup-container">
<img class="popup-img" src="${lugar.foto}">
<div class="popup-titulo">${ehParceiro ? '⭐ ' : ''}${lugar.nome}</div>
<a href="${linkMapa}" target="_blank" class="btn-rota">🚗 Ir de GPS</a>
</div>
`);

// 2. ADICIONAR ITEM NA LISTA VISUAL
const itemLista = document.createElement("div");
itemLista.className = `lugar-item ${ehParceiro ? 'parceiro' : ''}`;
itemLista.innerHTML = `
<img class="lugar-img" src="${lugar.foto}">
<div class="lugar-info">
<div class="lugar-nome">${lugar.nome}</div>
<div class="lugar-meta">${ehParceiro ? 'RECOMENDADO • ' : ''}${lugar.distancia.toFixed(1)} km de você</div>
<a href="${linkMapa}" target="_blank" class="btn-rota" style="padding: 3px 8px; font-size:10px;">Rotas</a>
</div>
`;
// Ao clicar no card na lista, muda para o mapa e foca no ponto
itemLista.addEventListener('click', (e) => {
if(e.target.tagName !== 'A') {
mudarAba('mapa');
mapa.setView([lugar.lat, lugar.lon], 15);
m.openPopup();
}
});
listaContainer.appendChild(itemLista);
});
}

function filtrarCategoria(cat, elemento) {
filtroAtual = cat;
document.querySelectorAll(".btn-filtro").forEach(el => el.classList.remove("ativo"));
elemento.classList.add("ativo");
atualizarElementosTela();
}

function mudarAba(aba) {
document.querySelectorAll(".aba").forEach(el => el.classList.remove("ativa"));
document.querySelectorAll(".conteudo-aba").forEach(el => el.classList.remove("ativa"));

if (aba === 'mapa') {
document.getElementById("aba-mapa").classList.add("ativa");
document.getElementById("container-mapa").classList.add("ativa");
setTimeout(() => mapa.invalidateSize(), 100); // Força recarregamento correto do Leaflet
} else {
document.getElementById("aba-lista").classList.add("ativa");
document.getElementById("container-lista").classList.add("ativa");
}
}

function calcularDistancia(lat1, lon1, lat2, lon2) {
const R = 6371;
const dLat = (lat2 - lat1) * Math.PI / 180;
const dLon = (lon2 - lon1) * Math.PI / 180;
const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}
</script>
</body>
</html>
